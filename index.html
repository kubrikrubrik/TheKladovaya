  <aside class="sidebar" aria-label="Разделы">

      <span class="brand-mark" aria-hidden="true"><span></span></span>
      <span class="brand-name">Кладовая</span>
    </a>
    <nav class="side-nav">
      <a href="#/products" data-nav="products"><svg class="i"><use href="#i-box"/></svg><span>Мои продукты</span><b data-count="products"></b></a>
      <a href="#/shopping" data-nav="shopping"><svg class="i"><use href="#i-cart"/></svg><span>Список покупок</span><b data-count="shopping"></b></a>

    </nav>

    </div>

<noscript><p class="noscript">Для работы «Кладовой» нужен включённый JavaScript.</p></noscript>
<script>
  if (location.protocol === 'file:') {
    document.addEventListener('DOMContentLoaded', function () {
      var b = document.getElementById('boot');
      if (b) b.innerHTML = '<div class="boot-error"><h2>Откройте сайт через веб-сервер</h2><p>Браузеры не разрешают загружать базы продуктов и рецептов напрямую с диска. Опубликуйте папку на GitHub Pages (инструкция в README.md) или запустите локально командой <code>python -m http.server</code> в папке проекта и откройте <code>http://localhost:8000</code>.</p></div>';
    });
  }
</script>
<script type="module" src="app.js"></script>
